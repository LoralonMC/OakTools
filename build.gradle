plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'dev.oakheart'
version = '2.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "coreprotect-repo"
        url = "https://maven.playpro.com"
    }
    maven {
        name = "codemc-repo"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    compileOnly("net.coreprotect:coreprotect:22.4")
    compileOnly("com.github.retrooper:packetevents-spigot:2.10.0")
    implementation("dev.oakheart:oakheart-core:1.3.0")
    implementation("dev.oakheart:oakheart-models:1.3.0")
    implementation("org.bstats:bstats-bukkit:3.1.0")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    relocate 'org.bstats', 'dev.oakheart.oaktools.bstats'
    relocate 'dev.oakheart.config', 'dev.oakheart.oaktools.libs.config'
    relocate 'dev.oakheart.message', 'dev.oakheart.oaktools.libs.message'
    relocate 'dev.oakheart.command', 'dev.oakheart.oaktools.libs.command'
    relocate 'dev.oakheart.util', 'dev.oakheart.oaktools.libs.util'
    relocate 'dev.oakheart.models', 'dev.oakheart.oaktools.libs.models'
    archiveClassifier.set('')
}

build.dependsOn shadowJar
