      max: 750
      use-vanilla-damage-bar: true
      repair-material: NONE
      repair-amount: 0
      unbreakable: false
    # Applied via enchanted books on the anvil (the enchanting table is blocked
    # for OakTools tools). Fortune/Silk Touch affect drops like a vanilla pickaxe.
    # Deliberately no UNBREAKING/MENDING: the tool ships with a set durability
