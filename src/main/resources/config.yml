    allowed-enchantments:
      - SILK_TOUCH
      - FORTUNE
    recipe:
      enabled: false
      category: EQUIPMENT
      shape:
        - "DDD"
        - " S "
        - " S "
      ingredients:
        D: DIAMOND
        S: STICK
    max-blocks: 32
    break-speed-ticks: 1
    # Show progress/completion action bar messages
    show-progress: true
    # Treat deepslate ore variants as the same vein (e.g. iron_ore + deepslate_iron_ore)
    group-deepslate: true

  # ============================================================
  # SICKLE — Crop Harvesting Tool
  # ============================================================
  # Vanilla-feel tiered tool. Harvests mature crops in an area and replants.
  # Uses vanilla durability, enchanting, repair — fully craftable.
  sickle:
    enabled: true
    # Take a replant seed from the player's inventory when the harvest drops
    # none. In vanilla this only happens for pitcher crops (a mature one drops
    # the plant, not a pod); datapacks can change other crops' drops. Only
    # plain seed items are consumed — renamed or enchanted stacks are left alone.
    replant-from-inventory: true
    # Prevent the sickle from tilling dirt/grass into farmland (it shares the
    # hoe item type, but a sickle is a harvesting tool, not a hoe)
    prevent-tilling: true
    # Prevent the sickle from breaking crops that aren't fully grown.
    # Immature crops can still be removed by hand or with any other tool.
    protect-immature-crops: true
    # Vegetation types the sickle clears in an area (non-crop blocks)
    clearable-vegetation:
      - SHORT_GRASS
      - TALL_GRASS
      - FERN
      - LARGE_FERN
      - DEAD_BUSH
      - BUSH
      - DANDELION
      - POPPY
      - BLUE_ORCHID
      - ALLIUM
      - AZURE_BLUET
      - RED_TULIP
      - ORANGE_TULIP
      - WHITE_TULIP
      - PINK_TULIP
      - OXEYE_DAISY
      - CORNFLOWER
      - LILY_OF_THE_VALLEY
      - TORCHFLOWER
      - WITHER_ROSE
      - SUNFLOWER
      - LILAC
      - ROSE_BUSH
      - PEONY
    tiers:
      wooden:
        display-name: "Wooden Sickle"
        model-id: "nexo:wooden_sickle"
        radius: 0
        recipe:
          enabled: true
          category: EQUIPMENT
          shape:
            - " PP"
            - "  P"
            - " S "
          ingredients:
            P: "#planks"
            S: STICK
      stone:
        display-name: "Stone Sickle"
        model-id: "nexo:stone_sickle"
        radius: 1
        recipe:
          enabled: true
          category: EQUIPMENT
          shape:
            - " CC"
            - "  C"
            - " S "
          ingredients:
            C: COBBLESTONE
            S: STICK
      iron:
        display-name: "Iron Sickle"
        model-id: "nexo:iron_sickle"
        radius: 2
        recipe:
          enabled: true
          category: EQUIPMENT
          shape:
            - " II"
            - "  I"
            - " S "
          ingredients:
            I: IRON_INGOT
            S: STICK
      gold:
        display-name: "Golden Sickle"
        model-id: "nexo:golden_sickle"
        radius: 5
        recipe:
          enabled: true
          category: EQUIPMENT
          shape:
            - " GG"
