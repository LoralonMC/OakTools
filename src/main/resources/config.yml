    base-material: WARPED_FUNGUS_ON_A_STICK
    # Model settings (choose one format):
    #   Integer (e.g., 1003) -> Vanilla CustomModelData (legacy)
    #   "model:namespace:key" -> Modern Item Model (1.21.4+, recommended)
    #   "nexo:id" -> Nexo plugin
    #   "itemsadder:id" -> ItemsAdder plugin
    model-id: "nexo:wand"
    durability:
      max: 250
      use-vanilla-damage-bar: true
      repair-material: IRON_INGOT
      repair-amount: 63  # 25% of max durability
    allowed-enchantments:
      - UNBREAKING
      - MENDING
    recipe:
      enabled: true
      category: EQUIPMENT
      shape:
        - " II"
        - " SI"
        - "S  "
      ingredients:
        I: IRON_INGOT
        S: STICK
    max-blocks: 64
    offhand-override: true
    undo:
      enabled: true
      max-history: 5
      expire-seconds: 300
    preview:
      # Shows a wireframe outline of the blocks the wand will place.
      # Requires the PacketEvents plugin — without it the wand still works, but no preview is shown.
      enabled: true
      interval-ticks: 5
      # Wireframe line thickness, in blocks (0.01-0.5)
      line-thickness: 0.05
      # Wireframe line color. Accepts a named color OR a hex code:
      #   named: black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple,
      #          gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, white
      #   hex:   #RRGGBB, or #AARRGGBB to include alpha
      # Text beams use the exact color and honor alpha (translucency); block beams snap to the
      # nearest concrete color and are always opaque.
      line-color: YELLOW
      # Beam rendering primitive:
      #   block - solid 3D block-display beams, consistent from every angle (recommended)
      #   text  - flat double-sided text-display ribbons; crisp and exact-colored, but thinner at
      #           grazing angles and uses ~2x as many entities
      beam-type: block
    mode-names:
      face: "Face"
      line: "Line"
    sounds:
      mode-switch: ui.button.click

  # ============================================================
  # HARVESTING TOOLS
  # ============================================================
  # Harvesting tools activate on block break (not right-click).
  # Sneak while breaking to mine a single block without activating.
  # Drops go directly to inventory; overflow to OakOverflow if installed.
  excavator:
    enabled: true
    # Display name and lore (MiniMessage format)
    # Placeholders: <tool>, <cur> (damage taken), <max>, <remaining>, <percent>
    display:
      enabled: true
      name: "<white>Excavation Shovel</white>"
      lore: []
    base-material: STONE_SHOVEL
    # Mining speed override (wood=2, stone=4, iron=6, diamond=8, netherite=9)
    # Set to 0 to use the base material's natural speed
    mining-speed: 4.0
    # Harvest level determines what blocks drop items (wood, stone, iron, diamond, netherite)
    # Set to "none" to use the base material's natural harvest level
    harvest-level: diamond
    model-id: ""
    durability:
      max: 500
      use-vanilla-damage-bar: true
      # Set to NONE to disable anvil repair
      repair-material: NONE
      repair-amount: 0
      # Set to true for infinite durability (no damage taken)
      unbreakable: false
    # Locked tool — no enchantments allowed (empty list blocks all)
    allowed-enchantments: []
    recipe:
      enabled: false
      category: EQUIPMENT
      shape:
        - " D "
        - " S "
        - " S "
      ingredients:
        D: DIAMOND
        S: STICK
    # Grid size (3 = 3x3, 5 = 5x5, etc. — must be odd)
    grid-size: 3
    # Ticks between each block break in the animation (1 = fastest)
    break-speed-ticks: 1
    # Show progress/completion action bar messages
    show-progress: true

  lumberjack:
